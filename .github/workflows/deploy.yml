name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Fly.io app name'
        required: true
        default: 'mcp-consciousness-bridge'

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build:prod
    
    - name: Setup Fly.io
      uses: superfly/flyctl-actions/setup-flyctl@master
    
    - name: Update fly.toml with app name
      run: sed -i 's/app = ".*"/app = "${{ github.event.inputs.app_name }}"/' fly.toml
    
    - name: Deploy to Fly.io
      run: flyctl deploy --app ${{ github.event.inputs.app_name }}
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
