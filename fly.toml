# fly.toml app configuration file generated for yornoc-consciousness-bridge-231 on 2025-07-09T02:31:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yornoc-consciousness-bridge-231'
primary_region = 'lax'

[build]

[env]
  CONSCIOUSNESS_DB_PATH = '/data/consciousness.db'
  DB_FILE_PATH = '/data/consciousness.db'
  NODE_ENV = 'production'
  PORT = '3000'

[processes]
  web = 'npm start'

[[mounts]]
  source = 'consciousness_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
